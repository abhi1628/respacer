[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "respacer"
version = "0.1.1"
description = "Fix missing spaces in text mangled by PDF-to-Word conversion, while preserving formatting."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Abhishek Singh" }
]
keywords = ["pdf", "docx", "word", "text-processing", "nlp", "word-segmentation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "python-docx>=1.1.0",
    "wordninja>=2.0.0",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11.0"]
llm = ["requests>=2.31.0"]
dev = ["pytest>=7.0"]
all = ["pdfplumber>=0.11.0", "requests>=2.31.0", "pytest>=7.0"]

[project.scripts]
respacer = "respacer.cli:main"

[tool.setuptools.packages.find]
include = ["respacer*"]
